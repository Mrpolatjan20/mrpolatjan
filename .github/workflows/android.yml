name: NEXUS CRM Professional Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "GitHub fayllari:"
          ls -la
          echo "ZIP qidirilmoqda:"
          find . -type f -iname "*.zip"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          ZIP_PATH=$(find . -type f -iname "NEXUS_CRM_Professional_v2.zip" | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "XATO: ZIP fayl GitHub repozitoriyasida yo'q!"
            exit 1
          fi

          unzip -o "$ZIP_PATH" -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p extracted/android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CRM-PROFESSIONAL
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
